<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs for Vansh</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Album Cover Hero -->
    <div class="hero-container">
        <div class="album-cover-wrapper">
            <img id="albumCover" src="album-cover.jpg" alt="Album Cover" class="album-cover">
            <div class="cover-info">
                <h1>Songs for Vansh</h1>
                <p class="artist">Your Music Collection</p>
            </div>
        </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
        <span>Scroll to explore songs ↓</span>
    </div>

    <!-- Songs List -->
    <div class="songs-container">
        <h2 class="section-title">All Songs</h2>
        <div class="songs-grid" id="songsGrid">
            <!-- Songs will be populated here by JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Songs for Vansh. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
